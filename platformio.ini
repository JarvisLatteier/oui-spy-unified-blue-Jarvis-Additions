[env:seeed_xiao_esp32s3]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32s3
framework = arduino

; Build options
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -Isrc/raw

; Upload options
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Libraries
lib_deps = 
    h2zero/NimBLE-Arduino@^1.4.0
    mathieucarbou/ESP Async WebServer@^3.0.6
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.0.4

; Board configuration
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; USB CDC configuration
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Exclude raw source files from compilation (they are #included by wrappers)
build_src_filter = +<*> -<raw/>

; ===========================================================================
; Freenove ESP32-S3 2.8" IPS CYD — Capacitive touch display, SD card, GPS,
; WS2812 NeoPixel. Modes: Selector, Flock-You, Sky Spy.
; ===========================================================================
[env:freenove_cyd_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_ldf_mode = deep

; Build options
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1
    -Isrc/raw
    ; Board identification
    -DBOARD_CYD_S3=1
    ; TFT display via TFT_eSPI — ILI9341 320x240
    -DENABLE_TFT_DISPLAY=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    ; Fonts
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1
    ; SD card + GPS
    -DHAS_SD_CARD=1
    -DHAS_GPS=1

; Upload options
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Libraries
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    mathieucarbou/ESP Async WebServer@^3.0.6
    bblanchon/ArduinoJson@^7.0.4
    bodmer/TFT_eSPI@^2.5.0
    adafruit/Adafruit NeoPixel@^1.12.0
    mikalhart/TinyGPSPlus@^1.1.0
    ricmoo/QRCode@^0.0.1

; Board configuration (8MB flash, no PSRAM)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.flash_size = 8MB
board_upload.flash_size = 8MB

; USB CDC configuration
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Exclude raw files + T-Dongle display + unused modes
build_src_filter =
    +<*>
    -<raw/>
    -<display.cpp>
    -<mode_detector.cpp>
    -<mode_foxhunter.cpp>

; ===========================================================================
; LILYGO T-Dongle-S3 — USB-stick form factor with 0.96" ST7735 TFT, APA102
; LED, and micro-SD card slot. No buzzer, no NeoPixel.
; ===========================================================================
[env:lilygo_tdongle_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_ldf_mode = deep

; Build options (no PSRAM on T-Dongle-S3)
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DARDUINO_RUNNING_CORE=1
    -Isrc/raw
    ; Board identification
    -DBOARD_TDONGLE_S3=1
    ; TFT display via TFT_eSPI (matches proven T-Dongle-S3 config)
    -DENABLE_TFT_DISPLAY=1
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DST7735_DRIVER=1
    -DST7735_GREENTAB160x80
    -DCGRAM_OFFSET=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DTFT_MISO=-1
    -DTFT_MOSI=3
    -DTFT_SCLK=5
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=1
    -DTFT_BL=38
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000
    -DTFT_RGB_ORDER=TFT_RGB
    ; Fonts
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSMOOTH_FONT=1
    ; SD card
    -DHAS_SD_CARD=1

; Upload options
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Libraries
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    mathieucarbou/ESP Async WebServer@^3.0.6
    bblanchon/ArduinoJson@^7.0.4
    bodmer/TFT_eSPI@^2.5.0

; Board configuration (no OPI PSRAM — T-Dongle-S3 has none)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; USB CDC configuration
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Exclude raw source files from compilation (they are #included by wrappers)
build_src_filter = +<*> -<raw/>
